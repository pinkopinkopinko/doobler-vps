# Подгружаем njs-модуль (динамический). Должно идти до `events { ... }`.
# Образ собирается через deploy/nginx/Dockerfile, где `apk add nginx-module-njs`
# кладёт .so в /usr/lib/nginx/modules/.
load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Telegram отправляет webhook'и небольшим JSON'ом (<10 KB).
    # Лимит 5 MB на всякий случай — под uploads фото в чат.
    client_max_body_size 5m;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip — Next.js сам жмёт ответы, но статику и API-JSON gzip-нём.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # ---- Rate-limit zones --------------------------------------------------
    # Telegram webhook: 30 r/s хватает с запасом — у бота нет broadcast.
    limit_req_zone $binary_remote_addr zone=bot_webhook:10m rate=30r/s;

    # Mini App API: 10 r/s на IP. С учётом polling /api/chats/:id/messages
    # каждые 3 секунды это далеко от лимита. С burst=20 кратковременные
    # всплески (например, отправка сообщения + reload списка) проходят.
    limit_req_zone $binary_remote_addr zone=api_rl:10m rate=10r/s;

    # Uploads (POST /api/uploads, /api/profile-photo и т.п.): 1 r/s.
    # Пользователь не аплоадит фото чаще раза в секунду; защита от
    # ботнетов, которые могут зафлудить storage.
    limit_req_zone $binary_remote_addr zone=upload_rl:10m rate=1r/s;

    # HTML/SSR-страницы: 5 r/s. Telegram WebApp при холодном запуске
    # делает ~3 запроса (главная, splash, /shifts), потом юзер кликает
    # ссылки руками — 5 r/s покрывает с запасом.
    limit_req_zone $binary_remote_addr zone=html_rl:10m rate=5r/s;

    # Конкуррентные коннекты с одного IP — глобальный кэп на 20.
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ---- Conditional Connection-header для WS-upgrade ----------------------
    # Сейчас никаких WS-маршрутов нет; map оставлен на будущее.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    # ---- njs-модуль: HMAC-валидация Telegram initData ----------------------
    # Используется через `auth_request /_validate_init_data` в локациях, где
    # клиент должен прислать `x-telegram-init-data`. См. dubler.conf и
    # njs/validate-init-data.js.
    js_import init_data from /etc/nginx/njs/validate-init-data.js;

    include /etc/nginx/conf.d/*.conf;
}
