user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Telegram отправляет webhook'и небольшим JSON'ом (<10 KB).
    # Лимит 5 MB на всякий случай — под uploads фото в чат.
    client_max_body_size 5m;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip — Next.js сам жмёт ответы, но статику и API-JSON gzip-нём.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Маленький rate-limit для бота: 30 webhook'ов/сек хватает с запасом.
    limit_req_zone $binary_remote_addr zone=bot_webhook:10m rate=30r/s;

    include /etc/nginx/conf.d/*.conf;
}
