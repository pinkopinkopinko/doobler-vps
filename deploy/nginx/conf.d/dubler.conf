# nginx vhost для Дублера.
#
# Workflow:
#   1) bootstrap.sh поднимает контейнеры, certbot выпускает сертификат
#      через webroot-плагин (порт 80, /.well-known/acme-challenge);
#   2) после первого успешного выпуска nginx уже отдаёт HTTPS;
#   3) certbot контейнер раз в 12 часов пытается обновить сертификат,
#      cron на хосте делает `docker exec doobler-nginx nginx -s reload`.
#
# Имя домена подставляется при старте контейнера через envsubst — см.
# bootstrap.sh, шаг "render nginx config".
#
# Edge-фильтрация:
#   - njs-модуль validate-init-data.js (см. ../njs/) проверяет
#     HMAC-SHA256 у `x-telegram-init-data` ДО proxy_pass в Next.js;
#   - rate-limit'ы по IP (zones объявлены в nginx.conf):
#       api_rl    — 10 r/s + burst 20 для Mini App API
#       upload_rl — 1 r/s + burst 3 для аплоадов
#       html_rl   — 5 r/s + burst 10 для SSR-страниц
#       bot_webhook — 30 r/s для /api/bot/webhook
#   - limit_conn 20 — кэп на одновременные коннекты с одного IP.

# ---- HTTP: ACME-challenge + редирект на HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    # ACME challenge (Let's Encrypt webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Всё остальное — на https.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: основной vhost ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — год, включая поддомены.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Frame-ancestors жёстко в Next.js через CSP, тут просто блок.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Глобальный лимит на одновременные коннекты с одного IP.
    limit_conn conn_per_ip 20;

    # ---- Internal sub-location для auth_request ----------------------------
    # Сюда nginx делает subrequest при `auth_request /_validate_init_data;`.
    # `internal` блокирует прямой доступ снаружи. njs читает заголовок
    # x-telegram-init-data из ОРИГИНАЛЬНОГО запроса (auth_request делает
    # subrequest с теми же заголовками клиента).
    location = /_validate_init_data {
        internal;
        js_content init_data.validate;
    }

    # ---- Telegram webhook (отдельная локация: rate-limit + без буферизации) ----
    # initData сюда не приходит — это сервер-сервер от Telegram. Защита: ниже
    # nginx сам режет по rate-limit, плюс в Next.js проверяется
    # X-Telegram-Bot-Api-Secret-Token (см. TELEGRAM_WEBHOOK_SECRET).
    location = /api/bot/webhook {
        limit_req zone=bot_webhook burst=10 nodelay;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # ---- Health-check — открыт, без auth_request и без rate-limit ----------
    # Используется внешним мониторингом и `curl https://doobler.ru/api/health`.
    location = /api/health {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 10s;
    }

    # ---- Auth-bootstrap: initData может быть НЕ в заголовке ----------------
    # /api/auth/bot-token — fallback-логин по разовому токену из URL, когда
    # Telegram WebApp не отдал initData (например, открытие из deep-link на
    # старом клиенте). initData может вообще отсутствовать; валидация на
    # уровне Next.js (route handler сам проверяет токен в БД).
    # /api/auth/client-debug — клиент пишет сюда логи bootstrap-фейлов,
    # когда initData ещё не пришёл. Auth_request тут бы блокировал
    # диагностику собственных же проблем.
    location = /api/auth/bot-token {
        limit_req zone=api_rl burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/auth/client-debug {
        limit_req zone=api_rl burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/auth/debug {
        # Debug-ручка, должна быть закрыта в проде — отвечаем 404 без
        # обращения к app.
        return 404;
    }

    # ---- Admin: cookie-сессия, не Telegram-сессия ----------------------------
    # njs-валидатор тут не нужен — администратор не открывает Mini App, а
    # ходит браузером с паролем. Авторизация в src/proxy.ts и /admin-login.
    location /api/admin/ {
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---- Uploads POST: edge-валидация + строгий rate-limit ----------------
    # POST /api/uploads — multipart, до 5 MB. Юзер не аплоадит чаще раза
    # в секунду; защита от ботов которые пытаются забить storage.
    location = /api/uploads {
        auth_request /_validate_init_data;
        limit_req zone=upload_rl burst=3 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # ---- Image GET'ы из чатов и аватаров: БЕЗ edge-валидации ---------------
    # Эти ручки грузятся через тег `<img src="...">` (или `<a href>`), а
    # браузер на такие запросы НЕ ставит заголовок `x-telegram-init-data` —
    # это обычный GET без JS. Если их прогнать через auth_request,
    # аватарки в чатах и вложения вернутся 401-белыми квадратами.
    # Защита внутри Next.js:
    #   /api/profile-photo/[userId]  — требует session cookie (getSessionPayload)
    #   /api/uploads/[id]            — требует session + participant-check
    location ~ ^/api/(profile-photo|uploads)/ {
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # ---- Mini App API: edge-валидация initData + api_rl --------------------
    # `auth_request /_validate_init_data` шлёт njs-проверку HMAC до того,
    # как запрос дойдёт до Next.js. Невалидные/просроченные initData
    # отлетают 401 на edge, не нагружая Node.js / Prisma.
    location /api/ {
        auth_request /_validate_init_data;
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Достаточно для долгих API (DaData с 3-сек таймаутом + БД).
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ---- Admin UI (HTML) -----------------------------------------------------
    # Открывается в обычном браузере, не в Telegram WebApp — initData нет.
    # Защита: 401/redirect в src/proxy.ts если нет admin-cookie.
    location /admin {
        limit_req zone=html_rl burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    location /admin-login {
        limit_req zone=html_rl burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---- Всё остальное (SSR-страницы, статика _next, иконки) ---------------
    # initData в HTML-запросе не приходит (Telegram WebApp инжектит его
    # только в JS). Защита — rate-limit и нагрузка на Next.js небольшая.
    location / {
        limit_req zone=html_rl burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Достаточно для SSR-страниц.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
