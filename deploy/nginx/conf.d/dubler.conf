# nginx vhost для Дублера.
#
# Workflow:
#   1) bootstrap.sh поднимает контейнеры, certbot выпускает сертификат
#      через webroot-плагин (порт 80, /.well-known/acme-challenge);
#   2) после первого успешного выпуска nginx уже отдаёт HTTPS;
#   3) certbot контейнер раз в 12 часов пытается обновить сертификат,
#      cron на хосте делает `docker exec doobler-nginx nginx -s reload`.
#
# Имя домена подставляется при старте контейнера через envsubst — см.
# bootstrap.sh, шаг "render nginx config".

# ---- HTTP: ACME-challenge + редирект на HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    # ACME challenge (Let's Encrypt webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Всё остальное — на https.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: основной vhost ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — год, включая поддомены.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Frame-ancestors жёстко в Next.js через CSP, тут просто блок.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Telegram webhook — отдельная локация с rate-limit и без буферизации.
    location = /api/bot/webhook {
        limit_req zone=bot_webhook burst=10 nodelay;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # Long-poll'ы и потенциальные SSE/websocket'ы (на будущее).
    location /api/chats/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Все остальные запросы Next.js'а.
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Достаточно для SSR-страниц.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
