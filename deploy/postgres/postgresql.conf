# PostgreSQL 16 tuned под Selectel VDS 2-4-50 (2 vCPU / 4 GB RAM / NVMe).
#
# При апгрейде на 4-8-80 — увеличить shared_buffers до 2GB,
# effective_cache_size до 6GB, work_mem до 32MB.

# ---- Connections ----
listen_addresses = '*'
max_connections = 50

# ---- Memory ----
shared_buffers = 1GB
effective_cache_size = 2GB
work_mem = 16MB
maintenance_work_mem = 128MB

# ---- WAL / checkpoints ----
wal_compression = on
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 256MB

# ---- Planner ----
random_page_cost = 1.1            # NVMe
effective_io_concurrency = 200    # NVMe
default_statistics_target = 100

# ---- Parallelism ----
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# ---- Logging ----
log_min_duration_statement = 500ms
log_checkpoints = on
log_connections = off
log_disconnections = off
log_line_prefix = '%t [%p]: db=%d,user=%u '
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# ---- Autovacuum ----
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 30s

# ---- Misc ----
timezone = 'Europe/Moscow'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
