<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Дублер · splash v2 · Gradient big</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;background:linear-gradient(155deg,rgba(232,124,189,0.7) 0%,rgba(186,135,224,0.7) 30%,rgba(135,148,232,0.7) 65%,rgba(118,148,238,0.7) 100%),#fff;color:#15131c;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:18px;">
      <span class="brand-mark brand-mark--ring" style="width:112px;height:112px;border-radius:32px;opacity:0.65;">Д</span>
      <div style="font-size:46px;font-weight:600;letter-spacing:-0.05em;line-height:1;">Дублер</div>
      <div style="font-size:14px;opacity:0.85;text-align:center;max-width:260px;">Сервис подмен и смен для ПВЗ Ozon, WB и Яндекс Маркета</div>
    </div>

    <div style="position:absolute;bottom:60px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="width:24px;height:24px;border:3px solid rgba(21,19,28,0.18);border-top-color:#15131c;border-radius:50%;animation:sp 0.8s linear infinite;"></div>
      <div style="font-size:12px;opacity:0.7;">Подключаем Telegram…</div>
    </div>
  </div>
  <style>@keyframes sp{to{transform:rotate(360deg)}}</style>
</body>
</html>
