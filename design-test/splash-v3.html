<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Дублер · splash v3 · Animated logo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;background:radial-gradient(ellipse at top,#fff 0%,#eaf4fd 60%,#dbeaf8 100%);">
    <!-- Логотип «дышит» в радиальном ореоле -->
    <div style="position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center;">
      <div style="position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle,rgba(51,135,209,0.18) 0%,rgba(51,135,209,0) 70%);animation:pulse 2.4s ease-in-out infinite;"></div>
      <span class="brand-mark" style="width:160px;height:160px;border-radius:36px;box-shadow:0 22px 50px rgba(51,135,209,0.32);animation:float 3s ease-in-out infinite;">Д</span>
    </div>

    <div style="margin-top:28px;font-size:42px;font-weight:600;letter-spacing:-0.05em;color:var(--ink);">Дублер</div>
    <div class="muted" style="font-size:13px;margin-top:8px;text-align:center;max-width:260px;">Поднимаемся на смену — без лишних шагов</div>

    <div style="position:absolute;bottom:80px;display:flex;align-items:center;gap:10px;">
      <div style="width:18px;height:18px;border:3px solid rgba(51,135,209,0.2);border-top-color:#3387d1;border-radius:50%;animation:sp 0.8s linear infinite;"></div>
      <span class="muted-2" style="font-size:12px;">Подключаем Mini App…</span>
    </div>
  </div>
  <style>
    @keyframes sp { to { transform: rotate(360deg); } }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-6px) rotate(0.5deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.7; }
      50%      { transform: scale(1.1);  opacity: 1; }
    }
  </style>
</body>
</html>
