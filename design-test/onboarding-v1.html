<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Дублер · onboarding v1 · Hero</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone" style="padding-bottom:24px;">
    <div class="status-bar"><span>9:41</span><span class="right">●●● 5G ▮▮▮</span></div>

    <!-- Hero -->
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 8px 12px;">
      <span class="brand-mark" style="width:96px;height:96px;border-radius:26px;box-shadow:0 18px 40px rgba(51,135,209,0.32);">Д</span>
      <h1 style="margin:18px 0 8px;font-size:30px;font-weight:600;letter-spacing:-0.05em;line-height:1.05;">Добро пожаловать<br/>в Дублер</h1>
      <p class="muted" style="margin:0;font-size:14px;max-width:280px;line-height:1.5;">Сервис подмен, смен и работы для ПВЗ Ozon, WB и Яндекс Маркета.</p>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 18px;">
      <div class="card" style="padding:14px;border-radius:18px;text-align:center;">
        <div style="font-size:22px;">⚡</div>
        <div style="font-size:13px;font-weight:600;margin-top:8px;">Срочные смены</div>
        <div class="muted-2" style="font-size:11px;margin-top:2px;">за 1 минуту</div>
      </div>
      <div class="card" style="padding:14px;border-radius:18px;text-align:center;">
        <div style="font-size:22px;">★</div>
        <div style="font-size:13px;font-weight:600;margin-top:8px;">Отзывы и рейтинг</div>
        <div class="muted-2" style="font-size:11px;margin-top:2px;">проверенные люди</div>
      </div>
    </div>

    <!-- form mock -->
    <div class="card card-lg">
      <p class="eyebrow">Регистрация</p>
      <h2 style="margin:6px 0 14px;font-size:20px;font-weight:600;letter-spacing:-0.03em;">Заполним профиль</h2>

      <div style="margin-bottom:10px;">
        <div class="muted-2" style="font-size:11px;margin-bottom:4px;">Имя</div>
        <div style="background:#f4f7fb;padding:12px 14px;border-radius:12px;font-size:14px;color:#101214;">Иван</div>
      </div>
      <div style="margin-bottom:10px;">
        <div class="muted-2" style="font-size:11px;margin-bottom:4px;">Город</div>
        <div style="background:#f4f7fb;padding:12px 14px;border-radius:12px;font-size:14px;color:#101214;">Москва</div>
      </div>
      <div style="margin-bottom:14px;">
        <div class="muted-2" style="font-size:11px;margin-bottom:4px;">Роль</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <span style="background:#3387d1;color:#fff;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600;">Сотрудник</span>
          <span style="background:#f4f7fb;color:#5f6975;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:500;">Владелец</span>
          <span style="background:#f4f7fb;color:#5f6975;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:500;">Подменный</span>
        </div>
      </div>
      <button style="width:100%;background:#3387d1;color:#fff;border:0;padding:14px;border-radius:14px;font-size:15px;font-weight:600;letter-spacing:-0.02em;">Войти в Дублер</button>
    </div>
  </div>
</body>
</html>
