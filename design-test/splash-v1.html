<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Дублер · splash v1 · Minimal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:20px;">
      <span class="brand-mark" style="width:104px;height:104px;border-radius:30px;box-shadow:0 18px 40px rgba(51,135,209,0.32);">Д</span>
      <div style="font-size:36px;font-weight:600;letter-spacing:-0.05em;">Дублер</div>
      <div class="muted" style="font-size:14px;text-align:center;max-width:240px;">Подмены и смены ПВЗ маркетплейсов</div>
      <div style="margin-top:18px;width:24px;height:24px;border:3px solid rgba(51,135,209,0.2);border-top-color:#3387d1;border-radius:50%;animation:sp 0.8s linear infinite;"></div>
    </div>
  </div>
  <style>@keyframes sp{to{transform:rotate(360deg)}}</style>
</body>
</html>
