<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dark · Create Shift</title>
    <link rel="stylesheet" href="app-pages.css" />
  </head>
  <body>
    <main class="phone">
      <h1 class="page-title">Создать смену</h1>
      <p class="page-lead">Опубликуйте замену для ПВЗ. Постоянная работа не используется.</p>

      <form class="card form-grid">
        <label class="form-label">
          <span>Заголовок</span>
          <input class="field" value="Срочно нужен сотрудник на вечер" />
        </label>
        <label class="form-label">
          <span>Тип объявления</span>
          <select class="field">
            <option>Срочная замена</option>
            <option>Смена на день</option>
          </select>
        </label>
        <label class="form-label">
          <span>Маркетплейс</span>
          <select class="field">
            <option>Ozon</option>
            <option>Wildberries</option>
          </select>
        </label>
        <label class="form-label">
          <span>Дата смены</span>
          <input class="field" value="2026-05-03" />
        </label>
        <label class="form-label">
          <span>Оплата, ₽</span>
          <input class="field" value="4500" />
        </label>
        <label class="form-label">
          <span>Адрес</span>
          <input class="field" value="Казань, ул. Чистопольская, 75" />
        </label>
        <label class="form-label">
          <span>Комментарий</span>
          <textarea class="field">Нужен опыт выдачи и возвратов.</textarea>
        </label>
        <span class="btn">Опубликовать объявление</span>
      </form>

      <nav class="bottom-nav">
        <div class="nav-item"><svg class="icon" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-6h6v6"/></svg><span>Главная</span></div>
        <div class="nav-item"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Смены</span></div>
        <div class="nav-item active"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8"/><path d="M8 12h8"/></svg><span>Создать</span></div>
        <div class="nav-item"><svg class="icon" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 4 11.5a8.5 8.5 0 0 1 17 0Z"/></svg><span>Чаты</span></div>
        <div class="nav-item"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Профиль</span></div>
      </nav>
    </main>
  </body>
</html>
